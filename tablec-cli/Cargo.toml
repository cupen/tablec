[package]
name = "tablec-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
tablec-core = { path = "../tablec-core" }
clap = { version = "4.5.13", features = ["derive"] }
tempfile = "3.10.1"
rust_xlsxwriter = "0.90.1"
calamine = { version = "0.25.0", features = ["dates"] }
rand = "0.9.2"
glob = "0.3"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
webbrowser = "0.8"
urlencoding = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
http = "1"

[[bin]]
name = "tablec"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

