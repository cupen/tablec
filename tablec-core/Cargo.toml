[package]
name = "tablec-core"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.25.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.122"
rmp-serde = "1.1.2"
prost = "0.12.6"
indexmap = { version = "2.10.0", features = ["serde"] }
rand = "0.8.5"

[dev-dependencies]
pretty_assertions = "1"

[build-dependencies]
prost-build = "0.14.1"
