[package]
name = "tablec-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
tablec-core = { path = "../tablec-core" }
axum = "0.7"
include_dir = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
webbrowser = "0.8"
urlencoding = "2"
http = "1"
calamine = { version = "0.25.0", features = ["dates"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.10.1"

[dev-dependencies]
serde_json = "1"