[workspace]
members = [
    ".", # Refers to the tablec crate in the root directory
    "pybinding",
]

[package]
name = "tablec"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.25.0"
clap = { version = "4.5.13", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.122"
rmp-serde = "1.1.2"
prost = "0.12.6"
indexmap = { version = "2.10.0", features = ["serde"] }
actix-web = "4.0"
tempfile = "3.10.1"

[build-dependencies]
prost-build = "0.12.6"

[[bin]]
name = "tablec"
path = "src/main.rs"
