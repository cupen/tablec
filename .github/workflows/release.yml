name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration-test:
    name: Run integration suite (test/ repo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Dispatch integration workflow to test/ repo
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is not configured. Add a PAT with 'repo' scope to this repo's secrets."
            exit 1
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository_owner }}/test/dispatches \
            -f event_type=run-integration \
            -f client_payload[ref]=${{ github.sha }} \
            -f client_payload[trigger]=${{ github.event_name }} \
            -f client_payload[ref_name]=${{ github.ref_name }}

      - name: Wait for integration workflow to complete
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is not configured."
            exit 1
          fi
          echo "Waiting for integration workflow to start on test/ repo..."
          sleep 30

          # Poll for the integration workflow run triggered by repository_dispatch
          for i in $(seq 1 60); do
            RUN_ID=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository_owner }}/test/actions/workflows/integration.yml/runs?event=repository_dispatch&per_page=1" \
              --jq '.workflow_runs[0].id // empty')

            if [ -n "$RUN_ID" ]; then
              echo "Found integration workflow run: $RUN_ID"
              break
            fi

            echo "No run yet, waiting... ($i/60)"
            sleep 15
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Integration workflow did not start within timeout"
            exit 1
          fi

          # Poll for completion
          for i in $(seq 1 120); do
            STATUS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository_owner }}/test/actions/runs/$RUN_ID" \
              --jq '.status // empty')
            CONCLUSION=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository_owner }}/test/actions/runs/$RUN_ID" \
              --jq '.conclusion // empty')

            echo "Status: $STATUS, Conclusion: $CONCLUSION ($i/120)"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Integration tests passed."
                exit 0
              else
                echo "::error::Integration tests failed with conclusion: $CONCLUSION"
                echo "See: https://github.com/${{ github.repository_owner }}/test/actions/runs/$RUN_ID"
                exit 1
              fi
            fi

            sleep 15
          done

          echo "::error::Integration workflow did not complete within timeout"
          exit 1

  build:
    name: Build on ${{ matrix.os }}
    needs: integration-test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: Linux
            runs_on: ubuntu-latest
            archive_name: tablec-linux-x86_64.tar.gz
            binary_name: tablec

          - target: x86_64-pc-windows-msvc
            os: Windows
            runs_on: windows-latest
            archive_name: tablec-windows-x86_64.zip
            binary_name: tablec.exe

          - target: aarch64-apple-darwin
            os: macOS
            runs_on: macos-latest
            archive_name: tablec-macos-aarch64.tar.gz
            binary_name: tablec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive
        run: |
          mkdir -p artifacts

          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/
            cd artifacts
            powershell -Command "Compress-Archive -Path '${{ matrix.binary_name }}' -DestinationPath '../${{ matrix.archive_name }}'"
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/
            cd artifacts
            tar czf ../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 📦 Tablec Binary Release

          Tablec is a Rust-based table compiler for gamedev that processes Excel/CSV/JSON files into structured data formats.

          ### 🚀 Installation

          #### Linux (x86_64)
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tablec-linux-x86_64.tar.gz
          tar xzf tablec-linux-x86_64.tar.gz
          sudo mv tablec /usr/local/bin/
          ```

          #### macOS (Apple Silicon)
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tablec-macos-aarch64.tar.gz
          tar xzf tablec-macos-aarch64.tar.gz
          sudo mv tablec /usr/local/bin/
          ```

          #### Windows (x86_64)
          Download and extract the zip file from the assets below.

          ### 📚 Usage

          ```bash
          tablec --help
          tablec build -i input.xlsx -o output.json
          tablec check path/to/files
          tablec example -o example.xlsx -r 10
          tablec web --listen 127.0.0.1:8080
          ```

          ### 🔗 Documentation

          For more information, visit the [GitHub repository](https://github.com/${{ github.repository }}).
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          files: |
            artifacts/tablec-linux-x86_64.tar.gz
            artifacts/tablec-windows-x86_64.zip
            artifacts/tablec-macos-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
