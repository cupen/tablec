name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: Linux
            runs_on: ubuntu-latest
            archive_name: tablec-linux-x86_64.tar.gz
            binary_name: tablec

          - target: x86_64-pc-windows-msvc
            os: Windows
            runs_on: windows-latest
            archive_name: tablec-windows-x86_64.zip
            binary_name: tablec.exe

          - target: aarch64-apple-darwin
            os: macOS
            runs_on: macos-latest
            archive_name: tablec-macos-aarch64.tar.gz
            binary_name: tablec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive
        run: |
          mkdir -p artifacts

          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/
            cd artifacts
            powershell -Command "Compress-Archive -Path '${{ matrix.binary_name }}' -DestinationPath '../${{ matrix.archive_name }}'"
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/
            cd artifacts
            tar czf ../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 📦 Tablec Binary Release

          Tablec is a Rust-based table compiler for gamedev that processes Excel/CSV/JSON files into structured data formats.

          ### 🚀 Installation

          #### Linux (x86_64)
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tablec-linux-x86_64.tar.gz
          tar xzf tablec-linux-x86_64.tar.gz
          sudo mv tablec /usr/local/bin/
          ```

          #### macOS (Apple Silicon)
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tablec-macos-aarch64.tar.gz
          tar xzf tablec-macos-aarch64.tar.gz
          sudo mv tablec /usr/local/bin/
          ```

          #### Windows (x86_64)
          Download and extract the zip file from the assets below.

          ### 📚 Usage

          ```bash
          tablec --help
          tablec build -i input.xlsx -o output.json
          tablec check path/to/files
          tablec example -o example.xlsx -r 10
          tablec web --listen 127.0.0.1:8080
          ```

          ### 🔗 Documentation

          For more information, visit the [GitHub repository](https://github.com/${{ github.repository }}).
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          files: |
            artifacts/tablec-linux-x86_64.tar.gz
            artifacts/tablec-windows-x86_64.zip
            artifacts/tablec-macos-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
