syntax = "proto3";
package tablec;

message Tables {
    repeated Table tables = 1;
}

message Table {
    string name = 1;
    repeated Field fields = 2;
    repeated Row data = 3;
    repeated Constraint constraints = 4;
}

message Field {
    string name = 1;
    string type = 2;
    string desc = 3;
    repeated string rules = 4;
    repeated string tags = 5;
}

message Row {
    map<string, string> fields = 1; // Simplified for now, actual value types would be more complex
}

message Constraint {
    string name = 1;
    string value = 2;
}